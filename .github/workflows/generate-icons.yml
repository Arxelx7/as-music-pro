name: Generate PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - "icon.svg"
      - ".github/workflows/generate-icons.yml"
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert SVG icon to PNG sizes
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="icon.svg", write_to="icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="icon.svg", write_to="icon-512.png", output_width=512, output_height=512)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android PWA icons"
            git push
          fi
